<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résultats de pesées — STT-2902</title>
<style>
  :root {
    --ink: #1f2933;
    --paper: #fbfaf7;
    --line: #d8d3c8;
    --accent: #3d5a80;
    --accent-soft: #eef2f6;
    --error: #a4373a;
    --attention: #f24c4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    line-height: 1.5;
    padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: #5a6672;
    margin: 0 0 2rem;
    font-size: 0.98rem;
  }
  label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 0.3rem;
    color: #3a4450;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 1.25rem; }
  fieldset {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1rem 1rem 0.9rem;
    margin: 0 0 1rem;
  }
  legend {
    padding: 0 0.4rem;
    font-size: 0.85rem;
    color: var(--accent);
  }
  .pesees-liste { margin-top: 0.5rem; }
  .pesee-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .pesee-row input { flex: 1; }
  .btn-retirer-pesee {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--error);
    font-size: 1rem;
    line-height: 1;
    padding: 0.4rem 0.65rem;
  }
  .btn-retirer-pesee:hover { background: #fbeceb; }
  .btn-ajouter-pesee {
    background: transparent;
    border: 1px dashed var(--accent);
    color: var(--accent);
    font-size: 0.88rem;
    padding: 0.4rem 0.8rem;
    margin-bottom: 0.85rem;
  }
  .btn-ajouter-pesee:hover { background: var(--accent-soft); }
  .stats-ligne {
    font-size: 0.88rem;
    color: #5a6672;
    margin: 0.25rem 0 0;
  }
  .stats-ligne strong { color: var(--ink); }
  .row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.75rem;
  }
  @media (max-width: 520px) {
    .row-grid { grid-template-columns: 1fr; }
  }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 0.65rem 1.3rem;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  #btn-generer, #btn-envoyer {
    background: var(--accent);
    color: #fff;
  }
  #btn-generer:hover, #btn-envoyer:hover { background: #2f4763; }
  #btn-reinitialiser {
    background: var(--attention);
    color: #edf0f3;
    border: 1px solid var(--line);
    margin-top: 0.75rem;
  }
  #btn-reinitialiser:hover { background: #f0ede6; }
  #lignes-container { display: none; }
  #confirmation, #erreur {
    display: none;
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  #confirmation { background: var(--accent-soft); color: var(--accent); }
  #confirmation p { margin: 0.3rem 0; }
  #confirmation strong { color: var(--ink); }
  #erreur { background: #fbeceb; color: var(--error); }
  hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Résultats de pesées</h1>
  <p class="subtitle">Entrez vos résultats ci-dessous. Chaque envoi ajoute vos lignes à la feuille de calcul du cours.</p>

  <div class="field" id="poids-total-field">
    <label for="poids-total">Poids total des vis (g)</label>
    <input type="number" id="poids-total" min="0" step="any" required>
  </div>

  <div class="field">
    <label for="nb-tailles">Combien de tailles d'échantillon avez-vous testées ?</label>
    <input type="number" id="nb-tailles" min="1" max="50" step="1" placeholder="ex. 3">
  </div>
  <button type="button" id="btn-generer">Continuer</button>

  <hr>

  <form id="lignes-container">
    <div id="lignes-liste"></div>
    <button type="submit" id="btn-envoyer">Envoyer les résultats</button>
  </form>

  <button type="button" id="btn-reinitialiser">Réinitialiser tout</button>

  <div id="confirmation"></div>
  <div id="erreur">Une erreur est survenue. Vérifiez vos valeurs et réessayez.</div>
</div>

<script>
  // Remplacez cette URL par celle de votre déploiement Google Apps Script (voir Code.gs)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGCreyYAVpUqmYxK9yxxhExfz_A2jU9H7tV9atmIr_XIzip8RPd2TadxQHH3O51mV4_w/exec";

  const nbTaillesInput = document.getElementById('nb-tailles');
  const btnGenerer = document.getElementById('btn-generer');
  const btnReinitialiser = document.getElementById('btn-reinitialiser');
  const lignesContainer = document.getElementById('lignes-container');
  const lignesListe = document.getElementById('lignes-liste');
  const poidsTotalInput = document.getElementById('poids-total');
  const confirmation = document.getElementById('confirmation');
  const erreur = document.getElementById('erreur');

  // Recalcule et affiche le nombre de pesées, la moyenne et la variance
  // estimée (avec dénominateur n-1) pour une ligne (un fieldset) donnée.
  function recalculerStats(fs) {
    const valeurs = Array.from(fs.querySelectorAll('.pesee-input'))
      .map(inp => parseFloat(inp.value))
      .filter(v => !isNaN(v));

    const nbSpan = fs.querySelector('.val-nb');
    const moyenneSpan = fs.querySelector('.val-moyenne');
    const varianceSpan = fs.querySelector('.val-variance');

    const n = valeurs.length;
    nbSpan.textContent = n;

    if (n === 0) {
      moyenneSpan.textContent = '—';
      varianceSpan.textContent = '—';
      return;
    }

    const moyenne = valeurs.reduce((a, b) => a + b, 0) / n;
    moyenneSpan.textContent = moyenne.toFixed(4);

    if (n < 2) {
      varianceSpan.textContent = '—';
    } else {
      const sommeCarresEcarts = valeurs.reduce((acc, v) => acc + Math.pow(v - moyenne, 2), 0);
      const variance = sommeCarresEcarts / (n - 1);
      varianceSpan.textContent = variance.toFixed(4);
    }
  }

  function ajouterPesee(liste) {
    const row = document.createElement('div');
    row.className = 'pesee-row';
    row.innerHTML = `
      <input type="number" step="any" class="pesee-input" placeholder="Poids d'une pesée">
      <button type="button" class="btn-retirer-pesee" aria-label="Retirer cette pesée">×</button>`;
    row.querySelector('.btn-retirer-pesee').addEventListener('click', () => {
      const fs = liste.closest('fieldset');
      row.remove();
      recalculerStats(fs);
    });
    liste.appendChild(row);
  }

  function creerLigne(i) {
    const fs = document.createElement('fieldset');
    fs.innerHTML = `
      <legend>Taille d'échantillon ${i}</legend>
      <div class="field">
        <label for="taille-${i}">Taille d'échantillon (n)</label>
        <input type="number" id="taille-${i}" class="taille-input" min="1" step="1" required>
      </div>
      <label>Pesées</label>
      <div class="pesees-liste"></div>
      <button type="button" class="btn-ajouter-pesee">+ Ajouter une pesée</button>
      <p class="stats-ligne">
        Nombre de pesées : <strong class="val-nb">0</strong> —
        Moyenne : <strong class="val-moyenne">—</strong> —
        Variance estimée : <strong class="val-variance">—</strong>
      </p>`;

    const liste = fs.querySelector('.pesees-liste');
    ajouterPesee(liste);
    ajouterPesee(liste);
    recalculerStats(fs);

    fs.querySelector('.btn-ajouter-pesee').addEventListener('click', () => {
      ajouterPesee(liste);
    });

    liste.addEventListener('input', () => recalculerStats(fs));

    return fs;
  }

  btnGenerer.addEventListener('click', () => {
    const n = parseInt(nbTaillesInput.value, 10);
    confirmation.style.display = 'none';
    erreur.style.display = 'none';

    if (!n || n < 1 || n > 50) {
      erreur.textContent = "Entrez un nombre de tailles d'échantillon entre 1 et 50.";
      erreur.style.display = 'block';
      return;
    }

    const nombreActuel = lignesListe.children.length;

    if (n < nombreActuel) {
      // Retire les lignes en trop (à partir de la fin), sans toucher aux autres
      for (let i = nombreActuel; i > n; i--) {
        lignesListe.removeChild(lignesListe.lastElementChild);
      }
    } else if (n > nombreActuel) {
      // Ajoute les nouvelles lignes manquantes, sans toucher aux lignes existantes
      for (let i = nombreActuel + 1; i <= n; i++) {
        lignesListe.appendChild(creerLigne(i));
      }
    }

    lignesContainer.style.display = 'block';
  });

  btnReinitialiser.addEventListener('click', () => {
    nbTaillesInput.value = '';
    poidsTotalInput.value = '';
    lignesListe.innerHTML = '';
    lignesContainer.style.display = 'none';
    confirmation.style.display = 'none';
    erreur.style.display = 'none';
  });

  // Estimation du poids d'une vis : moyenne pondérée de (poids moyen / taille)
  // sur toutes les lignes, chaque ligne étant pondérée par le nombre total
  // de vis qu'elle représente (taille × nombre de pesées).
  //
  // Variance de cette estimation : chaque ligne contribue une variance de
  // Var(poidsMoyen_i) = varianceLigne_i / nbPesees_i (variance de la moyenne
  // des pesées de cette ligne). L'estimation globale étant une combinaison
  // linéaire pondérée des poidsMoyen_i (poids = nbPesees_i / S), sa variance
  // vaut Σ(nbPesees_i × varianceLigne_i) / S². Les lignes avec une seule
  // pesée (variance non calculable) ne contribuent pas à cette somme.
  function calculerStatsGlobales(lignesCalcul) {
    let sommePoids = 0;
    let sommeVis = 0;
    let sommeVarPonderee = 0;
    let auMoinsUneVariance = false;

    lignesCalcul.forEach(l => {
      sommePoids += l.poidsMoyen * l.nbPesees;
      sommeVis += l.taille * l.nbPesees;
      if (l.varianceLigne !== null) {
        sommeVarPonderee += l.nbPesees * l.varianceLigne;
        auMoinsUneVariance = true;
      }
    });

    const poidsParVisEstime = sommePoids / sommeVis;
    const varPoidsParVisEstime = auMoinsUneVariance
      ? sommeVarPonderee / (sommeVis * sommeVis)
      : null;

    return { poidsParVisEstime, varPoidsParVisEstime };
  }

  lignesContainer.addEventListener('submit', async (e) => {
    e.preventDefault();
    confirmation.style.display = 'none';
    erreur.style.display = 'none';

    const lignes = [];
    const lignesCalcul = [];
    let ligneInvalide = false;

    Array.from(lignesListe.children).forEach((fs, index) => {
      if (ligneInvalide) return;
      const i = index + 1;
      const taille = parseFloat(fs.querySelector('.taille-input').value);
      const valeurs = Array.from(fs.querySelectorAll('.pesee-input'))
        .map(inp => parseFloat(inp.value))
        .filter(v => !isNaN(v));

      if (isNaN(taille) || valeurs.length === 0) {
        erreur.textContent = `Remplissez la taille d'échantillon et au moins une pesée pour la ligne ${i}.`;
        erreur.style.display = 'block';
        ligneInvalide = true;
        return;
      }

      const nbPesees = valeurs.length;
      const poidsMoyen = valeurs.reduce((a, b) => a + b, 0) / nbPesees;
      let varianceLigne = null;
      if (nbPesees >= 2) {
        const sommeCarresEcarts = valeurs.reduce((acc, v) => acc + Math.pow(v - poidsMoyen, 2), 0);
        varianceLigne = sommeCarresEcarts / (nbPesees - 1);
      }

      lignes.push({ taille, nbPesees, poidsMoyen });
      lignesCalcul.push({ taille, nbPesees, poidsMoyen, varianceLigne });
    });

    if (ligneInvalide) return;

    const poidsTotalVis = parseFloat(poidsTotalInput.value);
    if (isNaN(poidsTotalVis) || poidsTotalVis <= 0) {
      erreur.textContent = "Entrez le poids total des vis avant d'envoyer.";
      erreur.style.display = 'block';
      return;
    }

    const { poidsParVisEstime, varPoidsParVisEstime } = calculerStatsGlobales(lignesCalcul);
    const nombreVisEstime = Math.round(poidsTotalVis / poidsParVisEstime);

    // Propagation de l'incertitude par la méthode delta :
    // N̂ = poidsTotal / poidsParVisEstime, donc
    // Var(N̂) ≈ (poidsTotal² / poidsParVisEstime⁴) × Var(poidsParVisEstime).
    let varianceAffichee;
    if (varPoidsParVisEstime === null) {
      varianceAffichee = "non calculable (au moins 2 pesées sont nécessaires dans au moins une taille d'échantillon)";
    } else {
      const varianceNombreVis = (Math.pow(poidsTotalVis, 2) / Math.pow(poidsParVisEstime, 4)) * varPoidsParVisEstime;
      const ecartTypeNombreVis = Math.sqrt(varianceNombreVis);
      varianceAffichee = `${varianceNombreVis.toFixed(2)} (écart-type : ${ecartTypeNombreVis.toFixed(2)} vis)`;
    }

    const payload = { lignes, poidsTotalVis, poidsParVisEstime, nombreVisEstime };

    try {
      // mode "no-cors" + Content-Type "text/plain" : évite le préflight CORS
      // que les Web Apps Google Apps Script ne gèrent pas nativement.
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      confirmation.innerHTML = `
        <p>Vos résultats ont été envoyés. Merci !</p>
        <p>Poids estimé par vis : <strong>${poidsParVisEstime.toFixed(4)} g</strong></p>
        <p>Nombre de vis estimé dans le lot : <strong>${nombreVisEstime}</strong></p>
        <p>Variance estimée du nombre de vis : <strong>${varianceAffichee}</strong></p>`;
      confirmation.style.display = 'block';

      nbTaillesInput.value = '';
      poidsTotalInput.value = '';
      lignesListe.innerHTML = '';
      lignesContainer.style.display = 'none';
    } catch (err) {
      erreur.textContent = "Impossible de joindre le serveur. Vérifiez votre connexion et réessayez.";
      erreur.style.display = 'block';
    }
  });
</script>
</body>
</html>
